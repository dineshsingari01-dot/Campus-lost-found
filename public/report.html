<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report Item — Campus Lost & Found</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav>
    <span class="brand">Campus Lost &amp; Found</span>
    <ul id="nav-links"></ul>
  </nav>
  <main class="container">
    <div class="card">
      <h1>Report a Lost or Found Item</h1>
      <form id="report-form">
        <label>Item Title</label>
        <input type="text" id="title" required />
        <label>Category</label>
        <select id="category" required>
          <option value="">-- Select --</option>
          <option>Electronics</option><option>Books</option><option>Clothing</option>
          <option>ID Card</option><option>Keys</option><option>Bag</option><option>Other</option>
        </select>
        <label>Description</label>
        <textarea id="description" required></textarea>
        <label>Location</label>
        <input type="text" id="location" required />
        <label>Date</label>
        <input type="date" id="date" required />
        <label>Type</label>
        <select id="type" required>
          <option value="">-- Select --</option>
          <option value="lost">Lost</option>
          <option value="found">Found</option>
        </select>
        <label>Image URL (optional)</label>
        <input type="url" id="imageUrl" placeholder="https://..." />
        <button class="btn mt" type="submit">Submit Report</button>
      </form>
      <p id="dup-warning" class="muted mt hidden"></p>
    </div>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/report.js"></script>
</body>
</html>
